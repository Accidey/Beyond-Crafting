plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.10'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
kotlin.jvmToolchain(21)

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Wintercogs'
                url = uri('https://maven.wintercogs.com/releases')
            }
        }
        filter {
            includeGroup 'dev.compixel'
            includeGroup 'com.wintercogs.beyonddimensions'
        }
    }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument ''
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    compileOnly files("libs/beyonddimensions-${minecraft_version}-neoforge-${beyonddimensions_version}.jar")

    compileOnly "dev.compixel:compixel-neoforge-${minecraft_version}-with-kotlin:${compixel_version}"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"

    compileOnly files("libs/jei-1.21.1-neoforge-19.69.0.457.jar")
    compileOnly files("libs/emi-1.1.24+1.21.1+neoforge.jar")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            beyonddimensions_version: beyonddimensions_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
